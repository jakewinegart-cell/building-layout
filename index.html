<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b2a27">
  <title>Building Layout — draft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 8l7-6 7 6v7H1z%22 fill=%22%23ff6a00%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brandFull">Building&nbsp;Layout <span class="badge">draft</span></span><span class="brandMini" aria-hidden="true">⌂</span></div>
    <button id="doneBtn" class="doneBtn" title="Price your finished floor plan and get plans + build steps">Price check</button>
    <div class="seg" id="viewToggle" role="tablist" aria-label="View">
      <button data-view="plan" role="tab">Plan</button>
      <button data-view="3d" role="tab">3D</button>
    </div>
    <div class="topActions">
      <button id="layersBtn" class="iconBtn" title="Layers" aria-label="Layers"></button>
      <button id="menuBtn" class="iconBtn" title="More" aria-label="More"></button>
    </div>
    <div id="menu" class="menu" hidden>
      <button data-menu="done">Price check — price + plans + steps</button>
      <button data-menu="foundation">Foundation type — Piers only / pier shape</button>
      <button data-menu="zip">Location (ZIP) — code, frost depth, tax</button>
      <button data-menu="fit">Fit to footprint</button>
      <button data-menu="reset">Start over (sample 32×24)</button>
      <div class="menuNote">Saved on this device automatically.</div>
    </div>
  </header>

  <main id="stage">
    <canvas id="plan" aria-label="Plan view"></canvas>
    <div id="view3d" hidden></div>

    <div id="planTools" class="toolbar" role="toolbar" aria-label="Plan tools">
      <button data-tool="select" title="Select / move (drag empty space to pan)">Select</button>
      <button data-tool="rect" title="Footprint: drag a rectangle">▭ Footprint</button>
      <button data-tool="poly" title="Footprint: tap corners, tap the first corner to close">⬠ Shape</button>
      <button data-tool="wall" data-needs="walls" title="Interior wall (Walls layer)">Wall</button>
      <button data-tool="door" data-needs="walls" title="Door (tap a wall)">Door</button>
      <button data-tool="window" data-needs="walls" title="Window (tap a wall)">Window</button>
 <button data-tool="pier" data-needs="foundation" title="Place pier: tap to drop a Sonotube (snaps to grid + wall lines); tap a tube to edit it">◎ Pier</button>
      <button data-tool="line" data-needs="site,custom" title="Line (Site utilities or custom layer)">Line</button>
      <label class="snap">Snap <select id="snapSel"></select></label>
      <button id="polyDone" class="primary" hidden>Done</button>
    </div>

    <div id="pierOpts" class="pierOpts" hidden aria-label="Place pier options"></div>

    <div id="tools3d" class="toolbar" role="toolbar" aria-label="3D tools" hidden>
      <button data-cam="aerial">3/4</button>
      <button data-cam="front">Front</button>
      <button data-cam="side">Side</button>
      <button data-cam="top">Top</button>
      <button id="explodeBtn" class="toggle" aria-pressed="false">Exploded</button>
      <button id="wallModeBtn" class="toggle">Studs</button>
      <button id="sheathBtn" class="toggle" aria-pressed="false">Roof sheathing</button>
    </div>
    <div id="edit3d" class="toolbar row2" role="toolbar" aria-label="3D edit tools" hidden>
      <button id="sel3dBtn" class="toggle" aria-pressed="true" title="Tap to select · drag the selected item (or its ✥ handle) to move it · drag empty space to orbit">Select</button>
      <button id="pier3dBtn" class="toggle" aria-pressed="false" title="Tap the ground to drop a Sonotube">◎Pier</button>
      <button id="wall3dBtn" class="toggle" aria-pressed="false" data-add="wall" title="Drag along the floor to draw an interior wall">+Wall</button>
      <button id="door3dBtn" class="toggle" aria-pressed="false" data-add="door" title="Tap a wall to add a door">+Door</button>
      <button id="window3dBtn" class="toggle" aria-pressed="false" data-add="window" title="Tap a wall to add a window">+Win</button>
      <button id="xrayBtn" class="toggle" aria-pressed="false" title="X-ray: see through the layers above the active one">X-ray</button>
      <button id="del3dBtn" title="Delete the selected item" aria-label="Delete selected" disabled>🗑</button>
    </div>

    <div id="pierPanel" class="pierPanel" hidden role="dialog" aria-label="Selected pier"></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="regenBanner" class="regen" hidden role="status"></div>
    <div id="toast" class="toast" hidden></div>
    <button id="inspectBtn" class="inspectFab" type="button" aria-pressed="false" aria-label="Price inspect" title="Price inspect: point at any part to see what it costs"></button>
  </main>

  <aside id="sheet" class="sheet" data-state="peek" aria-label="Layers and properties">
    <button id="sheetHandle" class="handle" aria-label="Expand or collapse panel"><span></span></button>
    <div class="tabs" role="tablist">
      <button data-tab="layers" class="on">Layers</button>
      <button data-tab="props">Properties</button>
    </div>
    <div id="layersPane" class="pane"></div>
    <div id="propsPane" class="pane" hidden></div>
  </aside>

  <section id="report" class="report" hidden aria-label="Completion report"></section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
